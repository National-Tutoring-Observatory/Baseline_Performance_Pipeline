# Diagnostic Test: Full Sample with 2 specific model/prompt combinations
# Testing: GPT-5 ZeroShot and Claude FewShot_ALL
# Expected: GPT-5 ZeroShot should get Kappa ~0.48 (like manuscript)

sample_type: "full_sample"

sample_paths:
  full_sample: "data/inputs/FullSample_Chunks_WithID"
  stratified_sample: "data/inputs/stratified_samples/RepresentativeSample_Oversampled_Chunks"
  experiment_800: "data/inputs/stratified_samples/experiment_representative_800_chunks"

base_url: "https://api.openrouter.ai/api"

run_name: "Diagnostic_FullSample_2Combos"

# Two specific model/prompt combinations
models:
  - "anthropic.claude-4.5-sonnet"
  - "openai.gpt-5"

prompt_directory: "prompts"
specific_prompts:
  - "TalkMoves_Teacher_ZeroShot.json"
  - "TalkMoves_Teacher_FewShot_ALL.json"

parallel_workers: 30
temperature: 0.0
max_tokens: 16000
request_timeout: 300

# Run full sample
test_mode: false

auto_analyze: true
