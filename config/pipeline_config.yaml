# FloorBenchmark Pipeline Configuration - Full Sample Extension
# ==============================================================
# Adding missing model/prompt combinations to Diagnostic_FullSample_2Combos

# SAMPLE SELECTION
sample_type: "experiment_800"

# SAMPLE PATHS
sample_paths:
  full_sample: "data/inputs/FullSample_Chunks_WithID"
  stratified_sample: "data/inputs/stratified_samples/RepresentativeSample_Oversampled_Chunks"
  experiment_800: "data/inputs/stratified_samples/representative_800_chunks"

# OUTPUT CONFIGURATION
output_directory: "data/outputs"
run_name: "Experiment_800_NoReasoning"

# MODELS - 5 models (original 4 + 1 new)
# Already completed: claude-4.5-sonnet, gpt-5 (for ZeroShot & FewShot_ALL only)
# Pipeline will skip existing files, so we include all models
# Note: Removed openai.gpt-5.2-pro (not available on API gateway)
models:
  - "anthropic.claude-4.5-sonnet"
  - "openai.gpt-5"
  - "google.gemini-2.5-pro"
  - "openai.o3"
  - "google.gemini-3-pro-preview"
  - "anthropic.claude-4.5-opus"

# PROMPTS - All 4 prompts
# Already completed: ZeroShot, FewShot_ALL (for claude & gpt-5 only)
# Pipeline will skip existing files, so we include all prompts
prompt_directory: "prompts/TalkMoves_NoReasoningRequested"
specific_prompts:
  - "TalkMoves_Teacher_ZeroShot.json"
  - "TalkMoves_Teacher_OneShot.json"
  - "TalkMoves_Teacher_FewShot_3.json"
  - "TalkMoves_Teacher_FewShot_ALL.json"

# EXECUTION SETTINGS
parallel_workers: 30
temperature: 0.0
max_tokens: 16000
request_timeout: 300

# TEST MODE - OFF for full run
test_mode: false

# ANALYSIS
auto_analyze: true

# Ground truth file
ground_truth_file: "data/inputs/ground_truth/ground_truth_TalkMoves.csv"

# LOGGING
verbose_logging: true
log_file: "logs/pipeline.log"
