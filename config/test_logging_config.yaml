# Test configuration to verify prompt/model variation logging
sample_type: "experiment_800"

sample_paths:
  full_sample: "data/inputs/FullSample_Chunks_WithID"
  stratified_sample: "data/inputs/stratified_samples/RepresentativeSample_Oversampled_Chunks"
  experiment_800: "data/inputs/stratified_samples/experiment_representative_800_chunks"

base_url: "https://api.openrouter.ai/api"

run_name: "LoggingTest_PromptVariation"

# TEST: Just 2 specific model/prompt combos
models:
  - "anthropic.claude-4.5-sonnet"
  - "openai.gpt-5"

prompt_directory: "prompts"
specific_prompts:
  - "TalkMoves_Teacher_ZeroShot.json"
  - "TalkMoves_Teacher_FewShot_ALL.json"

parallel_workers: 2
temperature: 0.0
max_tokens: 16000
request_timeout: 300

# TEST MODE - Just run 1 chunk to verify logging
test_mode: true
test_start_offset: 0
test_subset_size: 1

auto_analyze: false
